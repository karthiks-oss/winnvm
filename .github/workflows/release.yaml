name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish WinNvm (Single-File)
        run: dotnet publish WinNvm.csproj -c Release -r win-x64 -p:PublishSingleFile=true --no-self-contained -o ./publish

      - name: Package Release Assets
        shell: powershell
        run: |
          Compress-Archive -Path ./publish/WinNvm.exe -DestinationPath ./WinNvm-${{ github.ref_name }}.zip

      - name: Generate Changelog & Create GitHub Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $isPrerelease = $false
          $releaseTitle = "Release $tag"

          if ($tag -match '-alpha[.-]?\d+$') {
              $isPrerelease = $true
              $releaseTitle = "Release $tag (Alpha)"
              Write-Host "Tag $tag matched alpha pre-release."
          } elseif ($tag -match '-beta[.-]?\d+$') {
              $isPrerelease = $true
              $releaseTitle = "Release $tag (Beta)"
              Write-Host "Tag $tag matched beta pre-release."
          } else {
              Write-Host "Tag $tag is a standard production release."
          }

          # Find the previous tag before this one
          $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null

          # Try querying GitHub API for commits to resolve real GitHub usernames
          $commitsData = @()
          try {
              if ($prevTag) {
                  Write-Host "Fetching compare $prevTag...$tag from GitHub API"
                  $resp = gh api "repos/$repo/compare/$prevTag...$tag" | ConvertFrom-Json
                  $commitsData = $resp.commits
              } else {
                  Write-Host "Fetching commits up to $tag from GitHub API"
                  $resp = gh api "repos/$repo/commits?sha=$tag&per_page=100" | ConvertFrom-Json
                  $commitsData = $resp
              }
          } catch {
              Write-Warning "GitHub API query failed, falling back to git log: $_"
          }

          $prList = [System.Collections.Generic.List[string]]::new()
          $commitList = [System.Collections.Generic.List[string]]::new()

          if ($commitsData -and $commitsData.Count -gt 0) {
              # GitHub compare API returns oldest to newest; reverse so latest is at the top
              [array]::Reverse($commitsData)

              foreach ($c in $commitsData) {
                  $fullHash = $c.sha
                  $shortHash = $fullHash.Substring(0, [Math]::Min(7, $fullHash.Length))
                  $subject = ($c.commit.message -split "`r?`n")[0]

                  # Use real GitHub @handle if account is linked, otherwise Git author name without '@'
                  if ($c.author -and $c.author.login) {
                      $authorHandle = "@$($c.author.login)"
                  } elseif ($c.commit.author -and $c.commit.author.name) {
                      $authorHandle = $c.commit.author.name
                  } else {
                      $authorHandle = "unknown"
                  }

                  $commitUrl = "https://github.com/$repo/commit/$fullHash"
                  $entry = "* $subject ([$shortHash]($commitUrl)) by $authorHandle"

                  if ($subject -match 'Merge pull request #(\d+)' -or $subject -match '\(#(\d+)\)') {
                      $prList.Add($entry)
                  } else {
                      $commitList.Add($entry)
                  }
              }
          } else {
              # Fallback to local git log
              $range = if ($prevTag) { "$prevTag..$tag" } else { $tag }
              $rawCommits = git log $range --pretty=format:"%H|%h|%s|%an"
              if ($rawCommits) {
                  foreach ($line in ($rawCommits -split "`r?`n")) {
                      if ([string]::IsNullOrWhiteSpace($line)) { continue }
                      $parts = $line -split '\|', 4
                      if ($parts.Length -lt 4) { continue }
                      $fullHash = $parts[0]
                      $shortHash = $parts[1]
                      $subject = $parts[2]
                      $author = $parts[3]

                      $commitUrl = "https://github.com/$repo/commit/$fullHash"
                      $entry = "* $subject ([$shortHash]($commitUrl)) by $author"

                      if ($subject -match 'Merge pull request #(\d+)' -or $subject -match '\(#(\d+)\)') {
                          $prList.Add($entry)
                      } else {
                          $commitList.Add($entry)
                      }
                  }
              }
          }

          $notes = [System.Text.StringBuilder]::new()
          [void]$notes.AppendLine("### What's Changed`n")

          if ($prList.Count -gt 0) {
              [void]$notes.AppendLine("#### Pull Requests")
              foreach ($pr in $prList) {
                  [void]$notes.AppendLine($pr)
              }
              [void]$notes.AppendLine("")
          }

          if ($commitList.Count -gt 0) {
              if ($prList.Count -gt 0) {
                  [void]$notes.AppendLine("#### Commits")
              }
              foreach ($c in $commitList) {
                  [void]$notes.AppendLine($c)
              }
              [void]$notes.AppendLine("")
          }

          if ($prevTag) {
              [void]$notes.AppendLine("**Full Changelog**: https://github.com/$repo/compare/$prevTag...$tag")
          } else {
              [void]$notes.AppendLine("**Full Changelog**: https://github.com/$repo/commits/$tag")
          }

          $notes.ToString() | Out-File -FilePath release-notes.md -Encoding utf8

          $ghArgs = @(
              "release", "create", $tag,
              "./WinNvm-$tag.zip",
              "./publish/WinNvm.exe#WinNvm-$tag-win-x64.exe",
              "--title", $releaseTitle,
              "--notes-file", "release-notes.md"
          )

          if ($isPrerelease) {
              $ghArgs += "--prerelease"
          }

          gh @ghArgs
