name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish WinNvm (Single-File)
        run: dotnet publish WinNvm.csproj -c Release -r win-x64 -p:PublishSingleFile=true --no-self-contained -o ./publish

      - name: Package Release Assets
        shell: powershell
        run: |
          Compress-Archive -Path ./publish/WinNvm.exe -DestinationPath ./WinNvm-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = $false
          $releaseTitle = "Release $tag"

          if ($tag -match '-alpha-?\d+$') {
              $isPrerelease = $true
              $releaseTitle = "Release $tag (Alpha)"
              Write-Host "Tag $tag matched alpha pre-release."
          } elseif ($tag -match '-beta-?\d+$') {
              $isPrerelease = $true
              $releaseTitle = "Release $tag (Beta)"
              Write-Host "Tag $tag matched beta pre-release."
          } else {
              Write-Host "Tag $tag is a standard production release."
          }

          $ghArgs = @(
              "release", "create", $tag,
              "./WinNvm-$tag.zip",
              "./publish/WinNvm.exe#WinNvm-$tag-win-x64.exe",
              "--title", $releaseTitle,
              "--generate-notes"
          )

          if ($isPrerelease) {
              $ghArgs += "--prerelease"
          }

          gh @ghArgs
