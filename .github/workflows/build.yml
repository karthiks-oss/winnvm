name: .NET Build

on:
  push:
    branches: [ master, develop, dotnetcore ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build solution
        run: dotnet build WinNvm.sln -c Release

      - name: Test Single-File Publish
        run: dotnet publish WinNvm.csproj -c Release -r win-x64 -p:PublishSingleFile=true --no-self-contained -o ./publish

      - name: Verify Published Executable
        run: dir .\publish
        shell: cmd
